{{- if .Values.migrations.enabled }}
{{- range $name := .Values.migrations.javaServices }}
{{- $service := index $.Values.services $name }}
{{- if $service.enabled }}
{{- $prefix := upper (trimSuffix "-SERVICE" (replace "-" "_" (upper $name))) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migrate-{{ $.Release.Revision }}
  labels:
    {{- include "swiftdrop.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-migration
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $.Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ $.Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}-migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "swiftdrop.serviceAccountName" (dict "root" $ "service" $name) }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "swiftdrop.image" (dict "root" $ "service" $service) | quote }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          args: ["--spring.main.web-application-type=none", "--spring.main.lazy-initialization=true"]
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef: {name: {{ include "swiftdrop.fullname" $ }}-config}
          env:
            {{- include "swiftdrop.databaseEnv" (dict "root" $ "prefix" $prefix) | nindent 12 }}
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
{{- end }}
{{- end }}
{{- $assistant := index .Values.services "ai-assistant-service" }}
{{- if $assistant.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: ai-assistant-service-migrate-{{ .Release.Revision }}
  labels:
    {{- include "swiftdrop.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-assistant-migration
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ai-assistant-migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "swiftdrop.serviceAccountName" (dict "root" . "service" "ai-assistant-service") }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "swiftdrop.image" (dict "root" . "service" $assistant) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: ASSISTANT_DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: ASSISTANT_DATABASE_URL}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
{{- end }}
{{- end }}
