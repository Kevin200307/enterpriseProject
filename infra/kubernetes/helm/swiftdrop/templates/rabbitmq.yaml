{{- if .Values.rabbitmq.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    {{- include "swiftdrop.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rabbitmq
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    - {name: management, port: 15672, targetPort: management}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    {{- include "swiftdrop.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: rabbitmq
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: RABBITMQ_USERNAME}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: RABBITMQ_PASSWORD}
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
          startupProbe:
            tcpSocket: {port: amqp}
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket: {port: amqp}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          # RabbitMQ recommends TCP readiness without a liveness probe. Repeated CLI health
          # processes can time out under CPU contention and restart a healthy broker.
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            runAsUser: 999
          volumeMounts:
            - {name: data, mountPath: /var/lib/rabbitmq}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: {{ .Values.rabbitmq.storage }}}
{{- end }}
