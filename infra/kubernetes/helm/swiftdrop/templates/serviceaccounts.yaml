{{- if .Values.serviceAccount.create }}
{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "swiftdrop.serviceAccountName" (dict "root" $ "service" $name) }}
  labels:
    {{- include "swiftdrop.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
{{- end }}
{{- end }}
{{- end }}
