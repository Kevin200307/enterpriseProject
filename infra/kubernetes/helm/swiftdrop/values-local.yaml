global:
  environment: local
  imagePullPolicy: Never

namespacePolicy:
  create: true
  enforce: baseline

config:
  webOrigins: http://swiftdrop.local:8088

services:
  web: {replicas: 1, image: {repository: swiftdrop/web, tag: dev}}
  gateway: {replicas: 1, image: {repository: swiftdrop/gateway, tag: dev}}
  identity-service: {replicas: 1, image: {repository: swiftdrop/identity-service, tag: dev}}
  parcel-service: {replicas: 1, image: {repository: swiftdrop/parcel-service, tag: dev}}
  pricing-service: {replicas: 1, image: {repository: swiftdrop/pricing-service, tag: dev}}
  dispatch-service: {replicas: 1, image: {repository: swiftdrop/dispatch-service, tag: dev}}
  merchant-service: {replicas: 1, image: {repository: swiftdrop/merchant-service, tag: dev}}
  tracking-service: {replicas: 1, image: {repository: swiftdrop/tracking-service, tag: dev}}
  notification-service: {replicas: 1, image: {repository: swiftdrop/notification-service, tag: dev}}
  ai-assistant-service: {replicas: 1, image: {repository: swiftdrop/ai-assistant-service, tag: dev}}

redis:
  enabled: true

rabbitmq:
  enabled: true

mailpit:
  enabled: true

ingress:
  enabled: true
  host: swiftdrop.local

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
