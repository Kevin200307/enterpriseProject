x-defaults: &defaults
  restart: unless-stopped
  networks:
    - swiftdrop
  mem_limit: 384m

services:
  # ---------------------------------------------------------------------
  # Local infrastructure — Postgres is NOT here, each service's database
  # lives in Neon (see infra/.env.example). Only Redis and RabbitMQ run
  # locally since they're shared, in-memory/queueing infra.
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - swiftdrop
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    networks:
      - swiftdrop
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15673}:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    networks:
      - swiftdrop
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP server
      - "${MAILPIT_UI_PORT:-8025}:8025"   # Web UI


  # ---------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------
  gateway:
    <<: *defaults
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    ports:
      - "${GATEWAY_HOST_PORT:-8081}:8080"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SERVER_PORT: 8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:-http://identity-service:8080/.well-known/jwks.json}
      IDENTITY_ISSUER_URI: ${IDENTITY_ISSUER_URI:-http://identity-service:8080}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-swiftdrop}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity-service:8080}
      PARCEL_SERVICE_URL: ${PARCEL_SERVICE_URL:-http://parcel-service:8080}
      PRICING_SERVICE_URL: ${PRICING_SERVICE_URL:-http://pricing-service:8080}
      DISPATCH_SERVICE_URL: ${DISPATCH_SERVICE_URL:-http://dispatch-service:8080}
      MERCHANT_SERVICE_URL: ${MERCHANT_SERVICE_URL:-http://merchant-service:8080}
      TRACKING_SERVICE_URL: ${TRACKING_SERVICE_URL:-http://tracking-service:8080}
      TRACKING_WEBSOCKET_URL: ${TRACKING_WEBSOCKET_URL:-ws://tracking-service:8080}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notification-service:8080}
      AI_ASSISTANT_SERVICE_URL: ${AI_ASSISTANT_SERVICE_URL:-http://ai-assistant-service:8080}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      DASHBOARD_UPSTREAM_TIMEOUT: ${DASHBOARD_UPSTREAM_TIMEOUT:-2s}
    depends_on:
      redis:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

  ai-assistant-service:
    <<: *defaults
    mem_limit: 512m
    build:
      context: ..
      dockerfile: services/ai-assistant-service/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SPRING_AI_OPENAI_API_KEY: ${OPENAI_API_KEY}

  dispatch-service:
    <<: *defaults
    build:
      context: ..
      dockerfile: services/dispatch-service/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SPRING_DATASOURCE_URL: ${DISPATCH_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DISPATCH_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DISPATCH_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:-http://identity-service:8080/.well-known/jwks.json}
      IDENTITY_ISSUER_URI: ${IDENTITY_ISSUER_URI:-http://identity-service:8080}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-swiftdrop}
      IDENTITY_SERVICE_URL: http://identity-service:8080
      PARCEL_SERVICE_URL: http://parcel-service:8080
      DISPATCH_CLIENT_SECRET: ${DISPATCH_CLIENT_SECRET:-}
    depends_on:
      rabbitmq:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  identity-service:
    <<: *defaults
    build:
      context: ..
      dockerfile: services/identity-service/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SPRING_DATASOURCE_URL: ${IDENTITY_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${IDENTITY_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${IDENTITY_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      IDENTITY_ISSUER_URI: ${IDENTITY_ISSUER_URI:-http://identity-service:8080}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-swiftdrop}
      IDENTITY_JWT_KEY_ID: ${IDENTITY_JWT_KEY_ID:-swiftdrop-v1}
      IDENTITY_JWT_PRIVATE_KEY: ${IDENTITY_JWT_PRIVATE_KEY}
      IDENTITY_JWT_PUBLIC_KEY: ${IDENTITY_JWT_PUBLIC_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@swiftdrop.lk}
      DISPATCH_CLIENT_SECRET: ${DISPATCH_CLIENT_SECRET:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  merchant-service:
    <<: *defaults
    build:
      context: ..
      dockerfile: services/merchant-service/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SPRING_DATASOURCE_URL: ${MERCHANT_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${MERCHANT_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MERCHANT_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_ISSUER_URI: ${IDENTITY_ISSUER_URI:-http://identity-service:8080}
      JWT_JWK_SET_URI: ${IDENTITY_JWKS_URI:-http://identity-service:8080/.well-known/jwks.json}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-swiftdrop}
      PRICING_SERVICE_URL: ${PRICING_SERVICE_URL:-http://pricing-service:8080}
    depends_on:
      rabbitmq:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

  notification-service:
    <<: *defaults
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SPRING_DATASOURCE_URL: ${NOTIFICATION_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5173}
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  parcel-service:
    <<: *defaults
    build:
      context: ..
      dockerfile: services/parcel-service/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SPRING_DATASOURCE_URL: ${PARCEL_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${PARCEL_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${PARCEL_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      JWT_ISSUER_URI: ${IDENTITY_ISSUER_URI:-http://identity-service:8080}
      JWT_JWK_SET_URI: ${IDENTITY_JWKS_URI:-http://identity-service:8080/.well-known/jwks.json}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-swiftdrop}
    depends_on:
      rabbitmq:
        condition: service_healthy

  pricing-service:
    <<: *defaults
    build:
      context: ..
      dockerfile: services/pricing-service/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SPRING_DATASOURCE_URL: ${PRICING_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${PRICING_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${PRICING_DB_PASSWORD}
      IDENTITY_JWKS_URI: ${IDENTITY_JWKS_URI:-http://identity-service:8080/.well-known/jwks.json}
      IDENTITY_ISSUER_URI: ${IDENTITY_ISSUER_URI:-http://identity-service:8080}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-swiftdrop}
      PRICING_INCLUDED_WEIGHT_KG: ${PRICING_INCLUDED_WEIGHT_KG:-1.00}
      PRICING_EXPRESS_PERCENT: ${PRICING_EXPRESS_PERCENT:-15.00}

  tracking-service:
    <<: *defaults
    build:
      context: ..
      dockerfile: services/tracking-service/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Static SPA served by nginx. API_BASE_URL is the gateway URL as the *browser* sees it
  # (host port), not the Compose DNS name. Add http://localhost:${WEB_HOST_PORT} to the
  # gateway's WEB_ORIGIN (CORS) allow-list.
  web:
    <<: *defaults
    mem_limit: 64m
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    ports:
      - "${WEB_HOST_PORT:-5174}:80"
    environment:
      API_BASE_URL: ${WEB_API_BASE_URL:-http://localhost:8081}
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-true}
    depends_on:
      - gateway

networks:
  swiftdrop:

volumes:
  redis-data:
  rabbitmq-data:
