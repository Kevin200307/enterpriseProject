name: Kubernetes validation

on:
  pull_request:
    paths:
      - "infra/kubernetes/**"
      - "services/**/Dockerfile"
      - "services/ai-assistant-service/app/**"
      - "services/gateway/src/**"
      - "services/notification-service/src/**"
      - ".dockerignore"
      - ".github/workflows/kubernetes-validate.yml"
  push:
    branches: [main]
    paths:
      - "infra/kubernetes/**"
      - "services/**/Dockerfile"
      - "services/ai-assistant-service/app/**"
      - "services/gateway/src/**"
      - "services/notification-service/src/**"
      - ".dockerignore"
      - ".github/workflows/kubernetes-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Lint and render chart
        shell: pwsh
        run: ./infra/kubernetes/tests/helm-render-tests.ps1

      - name: Verify local deployment orchestration without a cluster
        shell: pwsh
        run: ./infra/kubernetes/tests/local-script-tests.ps1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify migration and bootstrap manifests
        run: |
          python -m pip install pytest==8.4.2 PyYAML==6.0.3
          python -m pytest infra/kubernetes/tests/test_chart.py -q
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify migration runner success, retries and failure
        run: ./mvnw -B -f infra/kubernetes/migrations/pom.xml test

      - name: Verify event decoding and Kubernetes probe security
        run: >-
          ./mvnw -B -s infra/kubernetes/maven-settings.xml
          -pl services/gateway,services/notification-service -am
          -Dtest=RabbitMQConfigTest,ParcelStatusNotificationListenerTest,NotificationServiceTest,SecurityConfigTests
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dlogging.level.root=WARN -Ddebug=false test

      - name: Render validation artifacts
        run: |
          mkdir -p /tmp/swiftdrop-rendered
          helm template swiftdrop infra/kubernetes/helm/swiftdrop \
            --namespace swiftdrop \
            --values infra/kubernetes/helm/swiftdrop/values-local.yaml \
            > /tmp/swiftdrop-rendered/local.yaml
          helm template swiftdrop infra/kubernetes/helm/swiftdrop \
            --namespace swiftdrop \
            --values infra/kubernetes/helm/swiftdrop/values-production.example.yaml \
            > /tmp/swiftdrop-rendered/production.yaml

      - name: Validate Kubernetes schemas
        run: |
          docker run --rm -v /tmp/swiftdrop-rendered:/manifests:ro \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -ignore-missing-schemas /manifests

      - name: Scan Kubernetes configuration
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: infra/kubernetes
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
