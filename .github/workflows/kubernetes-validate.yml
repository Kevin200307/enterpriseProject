name: Kubernetes validation

on:
  pull_request:
    paths:
      - "infra/kubernetes/**"
      - ".github/workflows/kubernetes-validate.yml"
  push:
    branches: [main]
    paths:
      - "infra/kubernetes/**"
      - ".github/workflows/kubernetes-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Lint and render chart
        shell: pwsh
        run: ./infra/kubernetes/tests/helm-render-tests.ps1

      - name: Render validation artifacts
        run: |
          mkdir -p /tmp/swiftdrop-rendered
          helm template swiftdrop infra/kubernetes/helm/swiftdrop \
            --namespace swiftdrop \
            --values infra/kubernetes/helm/swiftdrop/values-local.yaml \
            > /tmp/swiftdrop-rendered/local.yaml
          helm template swiftdrop infra/kubernetes/helm/swiftdrop \
            --namespace swiftdrop \
            --values infra/kubernetes/helm/swiftdrop/values-production.example.yaml \
            > /tmp/swiftdrop-rendered/production.yaml

      - name: Validate Kubernetes schemas
        run: |
          docker run --rm -v /tmp/swiftdrop-rendered:/manifests:ro \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -ignore-missing-schemas /manifests

      - name: Scan Kubernetes configuration
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: infra/kubernetes
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
