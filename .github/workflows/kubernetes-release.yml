name: Build and deploy Kubernetes release

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after publishing images
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: web, context: apps/web, dockerfile: apps/web/Dockerfile}
          - {name: gateway, context: ., dockerfile: services/gateway/Dockerfile}
          - {name: identity-service, context: ., dockerfile: services/identity-service/Dockerfile}
          - {name: parcel-service, context: ., dockerfile: services/parcel-service/Dockerfile}
          - {name: pricing-service, context: ., dockerfile: services/pricing-service/Dockerfile}
          - {name: dispatch-service, context: ., dockerfile: services/dispatch-service/Dockerfile}
          - {name: merchant-service, context: ., dockerfile: services/merchant-service/Dockerfile}
          - {name: tracking-service, context: ., dockerfile: services/tracking-service/Dockerfile}
          - {name: notification-service, context: ., dockerfile: services/notification-service/Dockerfile}
          - {name: ai-assistant-service, context: ., dockerfile: services/ai-assistant-service/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/swiftdrop-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan published image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/swiftdrop-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Sign image using GitHub OIDC
        run: cosign sign --yes "${REGISTRY}/${{ github.repository_owner }}/swiftdrop-${{ matrix.name }}@${{ steps.build.outputs.digest }}"

  deploy:
    if: github.event_name == 'push' || inputs.deploy
    needs: publish
    runs-on: [self-hosted, kubernetes-deployer]
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      HELM_DRIVER: configmap
    steps:
      - uses: actions/checkout@v4
      - name: Build ephemeral in-cluster context
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KUBERNETES_SERVICE_HOST:-}"
          token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          kubectl config set-cluster in-cluster \
            --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}" \
            --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            --embed-certs=true
          kubectl config set-credentials github-deployer --token="$token"
          kubectl config set-context production \
            --cluster=in-cluster --user=github-deployer --namespace=swiftdrop
          kubectl config use-context production
      - name: Deploy atomic Helm release
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for service in web gateway identity-service parcel-service pricing-service dispatch-service merchant-service tracking-service notification-service ai-assistant-service; do
            args+=(--set "services.${service}.image.repository=swiftdrop-${service}")
            args+=(--set "services.${service}.image.tag=${GITHUB_SHA}")
          done
          helm upgrade --install swiftdrop infra/kubernetes/helm/swiftdrop \
            --namespace swiftdrop \
            --values infra/kubernetes/helm/swiftdrop/values-production.example.yaml \
            --set "global.imageRegistry=${REGISTRY}/${GITHUB_REPOSITORY_OWNER}" \
            "${args[@]}" \
            --atomic --wait --timeout 15m
      - name: Record deployed release
        run: |
          helm status swiftdrop --namespace swiftdrop
          kubectl get deployments --namespace swiftdrop \
            -o custom-columns=NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image
