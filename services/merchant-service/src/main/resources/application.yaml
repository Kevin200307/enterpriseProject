spring:
  application:
    name: merchant-service
  datasource:
    url: ${MERCHANT_DB_URL}
    username: ${MERCHANT_DB_USERNAME}
    password: ${MERCHANT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://identity-service:8080/.well-known/jwks.json}

server:
  port: 8080

logging:
  level:
    lk.ac.mrt.swiftdrop.merchant_service: DEBUG
    org.springframework.security: DEBUG

# Identity service URL for role grant calls
identity-service:
  url: ${IDENTITY_SERVICE_URL:http://identity-service:8080}
