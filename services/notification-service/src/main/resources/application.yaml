server:
  port: ${PORT:8086}

spring:
  application:
    name: notification-service

  # ---------------------------------------------------------------------------
  # PostgreSQL Datasource
  # ---------------------------------------------------------------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # ---------------------------------------------------------------------------
  # JPA & Hibernate Settings
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ---------------------------------------------------------------------------
  # Flyway Database Migrations
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ---------------------------------------------------------------------------
  # RabbitMQ Broker (Events)
  # ---------------------------------------------------------------------------
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:swiftdrop}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms

  # ---------------------------------------------------------------------------
  # Spring Mail
  # ---------------------------------------------------------------------------
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# -----------------------------------------------------------------------------
# Custom App Configurations
# -----------------------------------------------------------------------------
notification:
  security:
    issuer: ${IDENTITY_ISSUER_URI:http://identity-service:8080}
    jwks: ${IDENTITY_JWKS_URI:http://identity-service:8080/.well-known/jwks.json}
    audience: ${JWT_AUDIENCE:swiftdrop}

app:
  web:
    base-url: ${WEB_BASE_URL:http://localhost:5173}
  notification:
    mail:
      from: ${MAIL_FROM:no-reply@swiftdrop.lk}
    sms:
      mock-enabled: true


# -----------------------------------------------------------------------------
# Actuator Health Checks
# -----------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always