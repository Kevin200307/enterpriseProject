spring:
  application:
    name: pricing-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pricing}
    username: ${SPRING_DATASOURCE_USERNAME:pricing}
    password: ${SPRING_DATASOURCE_PASSWORD:pricing}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:180000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:240000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://identity-service:8080/.well-known/jwks.json}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
pricing:
  security:
    jwks: ${IDENTITY_JWKS_URI:http://identity-service:8080/.well-known/jwks.json}
    issuer: ${IDENTITY_ISSUER_URI:http://identity-service:8080}
    audience: ${JWT_AUDIENCE:swiftdrop}
  calculation:
    included-weight-kg: ${PRICING_INCLUDED_WEIGHT_KG:1.00}
    express-surcharge-percent: ${PRICING_EXPRESS_PERCENT:15.00}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
