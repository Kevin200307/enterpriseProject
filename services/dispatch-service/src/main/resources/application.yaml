spring:
  application:
    name: dispatch-service
  datasource:
    url: ${DISPATCH_DB_URL:jdbc:postgresql://localhost:5432/dispatch_db}
    username: ${DISPATCH_DB_USERNAME:dispatch}
    password: ${DISPATCH_DB_PASSWORD:dispatch}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:180000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:240000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 2
          initial-interval: 100ms
          multiplier: 2
          max-interval: 500ms
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
dispatch:
  security:
    issuer: ${IDENTITY_ISSUER_URI:http://identity-service:8080}
    jwks: ${IDENTITY_JWKS_URI:http://identity-service:8080/.well-known/jwks.json}
    audience: ${JWT_AUDIENCE:swiftdrop}
  identity-url: ${IDENTITY_SERVICE_URL:http://identity-service:8080}
  parcel-url: ${PARCEL_SERVICE_URL:http://parcel-service:8080}
  client-id: dispatch-service
  client-secret: ${DISPATCH_CLIENT_SECRET:}
  messaging-enabled: true
  retry-enabled: true
  retry-delay-ms: 1000
