server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Runtime config and the HTML shell must never be cached, or a redeploy would not be picked up.
  location = /config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Vite emits content-hashed filenames, so these are safe to cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA history fallback: deep links like /deliveries/new reload without a 404.
  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
